<!DOCTYPE html>
<html lang="fr" data-skin="auto" data-read="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manip'Phrases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan : un compagnon au choix sur fond bleu nuit, ambre en accent.
   Mise en page : grandes zones tactiles, cartes à contour franc, une seule colonne lisible.
   Les fonctions grammaticales ont couleur + forme + nom : jamais la couleur seule. */
:root {
  --bg: #F2F5FC; --surf: #FFFFFF; --surf2: #E8EDF8; --ink: #141B34; --ink2: #424C6B; --line: #8E9BBD;
  --brand: #1F2A5C; --accent: #FFB020; --accent-ink: #141B34; --ok: #17703A; --ko: #A8231B; --meh: #7A5200;
  --focus: #0A57D6; --mark: #FFF1C9;
  --c-S: #B71C1C; --c-V: #17703A; --c-COD: #1558C0; --c-COI: #6A32B0; --c-CC: #08707F;
  --font-body: "Lexend", Verdana, "Segoe UI", Arial, sans-serif;
  --font-display: "Fredoka", "Lexend", Verdana, Arial, sans-serif;
  --fs: 1; --ls: 0; --lh: 1.6; --shadow: 0 2px 0 rgba(20,27,52,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root[data-skin="auto"] { --bg:#11162A; --surf:#1B2242; --surf2:#252E57; --ink:#F2F5FF; --ink2:#C3CCE8; --line:#6B79A8; --brand:#9DB1FF; --focus:#FFD54A; --mark:#4A3A10;
    --ok:#6FD98F; --ko:#FF8F86; --meh:#FFC857; --c-S:#FF8A80; --c-V:#6FD98F; --c-COD:#82B5FF; --c-COI:#CBA0FF; --c-CC:#5ED4E6; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme: dark; }
}
:root[data-skin="dark"] { --bg:#11162A; --surf:#1B2242; --surf2:#252E57; --ink:#F2F5FF; --ink2:#C3CCE8; --line:#6B79A8; --brand:#9DB1FF; --focus:#FFD54A; --mark:#4A3A10;
  --ok:#6FD98F; --ko:#FF8F86; --meh:#FFC857; --c-S:#FF8A80; --c-V:#6FD98F; --c-COD:#82B5FF; --c-COI:#CBA0FF; --c-CC:#5ED4E6; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme: dark; }
:root[data-skin="hc"] { --bg:#000; --surf:#000; --surf2:#1A1A1A; --ink:#FFF; --ink2:#FFF; --line:#FFF; --brand:#FFD400; --accent:#FFD400; --accent-ink:#000; --focus:#00E5FF; --mark:#333300;
  --ok:#5CFF8F; --ko:#FF7A7A; --meh:#FFD400; --c-S:#FF6B6B; --c-V:#5CFF8F; --c-COD:#6BB6FF; --c-COI:#E0B0FF; --c-CC:#4DEBFF; --shadow:none; color-scheme: dark; }
:root[data-read="1"] { --font-body: "Atkinson Hyperlegible", Verdana, Arial, sans-serif; --font-display: "Atkinson Hyperlegible", Verdana, Arial, sans-serif; --ls: .04em; --lh: 1.85; }

* { box-sizing: border-box; }
html { font-size: calc(18px * var(--fs)); height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: var(--lh); letter-spacing: var(--ls); word-spacing: calc(var(--ls) * 3); }
:root[data-read="1"] body { text-align: left; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.25; margin: 0 0 .6rem; text-wrap: balance; }
h1 { font-size: 1.9rem; } h2 { font-size: 1.45rem; } h3 { font-size: 1.15rem; }
p { margin: 0 0 .8rem; max-width: 62ch; }
a { color: var(--brand); }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: .5rem; top: -4rem; background: var(--accent); color: var(--accent-ink); padding: .6rem 1rem; border-radius: 10px; z-index: 50; font-weight: 600; }
.skip:focus { top: .5rem; }

.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
header.top { border-bottom: 3px solid var(--line); background: var(--surf); }
.top-row { display: flex; align-items: center; gap: .8rem; padding: .6rem 0; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: .6rem; font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; color: var(--ink); text-decoration: none; }
.logo small { display: block; font-family: var(--font-body); font-size: .72rem; font-weight: 400; color: var(--ink2); }
.spacer { flex: 1; }
nav.main { background: var(--bg); border-bottom: 3px solid var(--line); }
nav.main ul { list-style: none; margin: 0; padding: .5rem 0; display: flex; flex-wrap: wrap; gap: .5rem; }
.navbtn { display: flex; align-items: center; gap: .5rem; min-height: 3rem; padding: .35rem .9rem; border: 3px solid var(--line); border-radius: 14px; background: var(--surf); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; letter-spacing: inherit; }
.navbtn svg { width: 1.4rem; height: 1.4rem; flex: none; }
.navbtn[aria-current="page"] { border-color: var(--brand); background: var(--surf2); box-shadow: inset 0 -5px 0 var(--accent); font-weight: 600; }
main { padding: 1.2rem 0 4rem; outline: none; }
main:focus, #title:focus { outline: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 3rem; padding: .5rem 1.1rem; border-radius: 14px; border: 3px solid var(--brand); background: var(--surf); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; letter-spacing: inherit; text-decoration: none; box-shadow: var(--shadow); }
.btn:hover { background: var(--surf2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-ink); font-weight: 600; }
:root[data-skin="hc"] .btn.primary { border-color: #000; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { border-color: var(--line); box-shadow: none; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.pill svg, .opt svg, .choice svg { width: 1.2rem; height: 1.2rem; flex: none; }
.btn svg { width: 1.2rem; height: 1.2rem; flex: none; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.grid { display: grid; gap: 1rem; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.card { background: var(--surf); border: 3px solid var(--line); border-radius: 18px; padding: 1.1rem 1.2rem; box-shadow: var(--shadow); }
.card.brand { border-color: var(--brand); }
.muted { color: var(--ink2); }
.small { font-size: .85rem; }
.pill { display: inline-flex; align-items: center; gap: .35rem; padding: .1rem .7rem; border: 2px solid var(--line); border-radius: 999px; font-size: .85rem; background: var(--surf); }

.heroes { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .7rem; margin: .6rem 0; }
.hero { display: flex; flex-direction: column; align-items: center; gap: .15rem; padding: .7rem .4rem; background: var(--surf); border: 3px solid var(--line); border-radius: 18px; color: var(--ink); font: inherit; cursor: pointer; }
.hero svg { width: 64px; height: 64px; }
.hero b { font-size: 1.05rem; }
.hero span { font-size: .85rem; color: var(--ink2); }
.hero[aria-pressed="true"] { border-color: var(--ink); background: var(--surf2); box-shadow: 0 0 0 3px var(--surf), 0 0 0 6px var(--ink); }
.hero:focus-visible { outline: 4px solid var(--focus, #1E5AFF); outline-offset: 3px; }
.cutline { display: flex; flex-wrap: wrap; align-items: center; gap: .15rem; margin: .6rem 0; font-size: 1.3rem; }
.cutline .cw { padding: .3rem .5rem; border: 2px solid var(--line); border-radius: 10px; background: var(--surf); font-weight: 600; }
.cutline .cut { min-width: 2.6rem; min-height: 2.6rem; display: inline-flex; align-items: center; justify-content: center; border: 2px dashed var(--line); border-radius: 12px; background: transparent; color: var(--ink); font: inherit; font-size: 1.4rem; cursor: pointer; }
.cutline .cut[aria-pressed="true"] { border: 3px solid var(--ink); background: var(--surf2); }
.cutline .cut:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
.fnrow { display: flex; flex-direction: column; gap: .4rem; padding: .7rem; border: 2px solid var(--line); border-radius: 14px; background: var(--surf); }
.fnrow .fnl { font-weight: 700; font-size: 1.1rem; }
.warn { padding: .7rem 1rem; border: 3px solid var(--meh, #B7791F); border-radius: 12px; background: var(--surf); margin: .8rem 0 0; }

/* Ambiances (thème de couleurs au choix, sans toucher aux couleurs des fonctions ni au contraste fort) */
.moods { display: flex; flex-wrap: wrap; gap: .6rem; margin: .6rem 0; }
.mood { display: inline-flex; align-items: center; gap: .6rem; padding: .5rem .9rem .5rem .6rem; background: var(--surf); border: 3px solid var(--line); border-radius: 999px; color: var(--ink); font: inherit; cursor: pointer; }
.mood .sw { width: 2rem; height: 2rem; border-radius: 50%; border: 3px solid var(--ink); flex: none; }
.mood[aria-pressed="true"] { border-color: var(--ink); background: var(--surf2); box-shadow: 0 0 0 3px var(--surf), 0 0 0 6px var(--ink); }
.mood:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
:root[data-mood="espace"][data-skin="light"], :root[data-mood="espace"][data-skin="auto"] { --brand: #2D2A8F; --accent: #5EE0FF; --bg: #EEF0FF; --surf2: #E1E5FF; }
:root[data-mood="stade"][data-skin="light"], :root[data-mood="stade"][data-skin="auto"] { --brand: #A8420A; --accent: #FF8A2B; --bg: #FFF4EA; --surf2: #FCE5D0; }
:root[data-mood="ocean"][data-skin="light"], :root[data-mood="ocean"][data-skin="auto"] { --brand: #005F73; --accent: #33C7D8; --bg: #EAF8FA; --surf2: #D5EEF3; }
:root[data-mood="neon"][data-skin="light"], :root[data-mood="neon"][data-skin="auto"] { --brand: #7B1FA2; --accent: #FF5CAD; --bg: #FDEFF8; --surf2: #F6DCEC; }
@media (prefers-color-scheme: dark) {
  :root[data-mood="espace"][data-skin="auto"] { --brand: #A9A6FF; --accent: #5EE0FF; }
  :root[data-mood="stade"][data-skin="auto"] { --brand: #FFB27A; --accent: #FF8A2B; }
  :root[data-mood="ocean"][data-skin="auto"] { --brand: #6FDCEB; --accent: #33C7D8; }
  :root[data-mood="neon"][data-skin="auto"] { --brand: #E6A0FF; --accent: #FF5CAD; }
}
:root[data-mood="espace"][data-skin="dark"] { --brand: #A9A6FF; --accent: #5EE0FF; }
:root[data-mood="stade"][data-skin="dark"] { --brand: #FFB27A; --accent: #FF8A2B; }
:root[data-mood="ocean"][data-skin="dark"] { --brand: #6FDCEB; --accent: #33C7D8; }
:root[data-mood="neon"][data-skin="dark"] { --brand: #E6A0FF; --accent: #FF5CAD; }
/* Compagnon choisi par l'élève */
.mascot { display: flex; align-items: flex-end; gap: .8rem; }
.mascot svg { width: 84px; height: 84px; flex: none; }
.bubble { position: relative; background: var(--surf); border: 3px solid var(--brand); border-radius: 18px; padding: .7rem 1rem; max-width: 60ch; }
.bubble::before { content: ""; position: absolute; left: -12px; bottom: 18px; width: 18px; height: 18px; background: var(--surf); border-left: 3px solid var(--brand); border-bottom: 3px solid var(--brand); transform: rotate(45deg); }
.bubble p { margin: 0; }

/* cartes d'accueil */
.tile { display: flex; flex-direction: column; gap: .4rem; text-decoration: none; color: var(--ink); background: var(--surf); border: 3px solid var(--line); border-radius: 18px; padding: 1.1rem; min-height: 9.5rem; box-shadow: var(--shadow); cursor: pointer; font: inherit; text-align: left; letter-spacing: inherit; }
.tile:hover { border-color: var(--brand); background: var(--surf2); }
.tile svg { width: 2.6rem; height: 2.6rem; color: var(--brand); }
.tile b { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; }

/* écussons de fonctions */
.fnbadge { display: inline-flex; align-items: center; gap: .45rem; min-height: 3rem; padding: .3rem .9rem; border: 3px solid var(--fc, var(--line)); border-radius: 14px 14px 22px 22px; background: var(--surf); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; letter-spacing: inherit; }
.fnbadge svg { width: 1.45rem; height: 1.45rem; color: var(--fc); flex: none; }
.fnbadge:hover { background: var(--surf2); }
.fnbadge[aria-pressed="true"] { background: var(--surf2); box-shadow: inset 0 -5px 0 var(--fc); }
.fnbadge.plain { cursor: default; }
.f-S { --fc: var(--c-S); } .f-V { --fc: var(--c-V); } .f-COD { --fc: var(--c-COD); } .f-COI { --fc: var(--c-COI); } .f-CC { --fc: var(--c-CC); }

/* phrases et groupes de mots */
.sent { display: flex; flex-wrap: wrap; gap: .5rem .5rem; align-items: flex-start; font-size: 1.2rem; }
.chunkwrap { display: flex; flex-direction: column; align-items: center; gap: .15rem; }
.chunk { display: inline-block; padding: .3rem .8rem; border: 3px dashed var(--line); border-radius: 12px; background: var(--surf); color: var(--ink); font: inherit; font-size: inherit; letter-spacing: inherit; min-height: 2.8rem; }
button.chunk { cursor: pointer; }
button.chunk:hover { background: var(--surf2); }
button.chunk[aria-pressed="true"] { border-style: solid; border-color: var(--ink); background: var(--mark); box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--ink); }
.chunk.tagged { border-style: solid; border-color: var(--fc); }
.chunk.target { border-style: solid; border-color: var(--ink); background: var(--mark); font-weight: 600; text-decoration: underline wavy var(--ink2); text-underline-offset: 6px; }
.chunk.ghost { border-style: dotted; color: var(--ink2); background: transparent; }
.chunk.pron { border-style: solid; border-color: var(--ink); background: var(--mark); font-weight: 600; }
.tagrow { display: inline-flex; align-items: center; gap: .3rem; font-size: .8rem; font-weight: 600; color: var(--ink); }
.tagrow svg { width: 1rem; height: 1rem; color: var(--fc); }
.punct { align-self: flex-end; padding-bottom: .3rem; font-size: 1.2rem; }

/* outils */
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .6rem; }
.tool { display: flex; align-items: center; gap: .6rem; min-height: 3.4rem; padding: .4rem .9rem; border: 3px solid var(--brand); border-radius: 14px 14px 14px 26px; background: var(--surf); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; letter-spacing: inherit; }
.tool svg { width: 1.5rem; height: 1.5rem; flex: none; color: var(--brand); }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-ink); }
.tool[aria-pressed="true"] svg { color: var(--accent-ink); }
.tool[disabled] { opacity: .45; cursor: not-allowed; }
.verdict { display: flex; gap: .7rem; align-items: flex-start; border: 3px solid var(--vc, var(--line)); border-radius: 14px; padding: .8rem 1rem; background: var(--surf); }
.verdict svg { width: 1.8rem; height: 1.8rem; flex: none; color: var(--vc); margin-top: .1rem; }
.demohead { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem; margin-bottom: .4rem; }
.stampbar { display: flex; gap: .6rem; flex: none; }
.stamp.tool { --vc: var(--ink); border-style: dashed; }
.demohead h3 { margin: .3rem 0 0; flex: 1 1 auto; min-width: 0; }
@media (max-width: 480px) { .demohead { flex-direction: column-reverse; align-items: stretch; } .stampbar { justify-content: flex-end; } .stamp { min-width: 0; width: 6.6rem; max-width: 6.6rem; font-size: .76rem; padding: .35rem .2rem .4rem; box-sizing: border-box; } .stamp svg { width: 1.9rem !important; height: 1.9rem !important; } }
.stamp { display: inline-flex; flex-direction: column; align-items: center; gap: .1rem; min-width: 5.6rem; padding: .45rem .8rem .5rem; border: 4px solid var(--vc); border-radius: 16px; background: var(--surf); box-shadow: 0 0 0 3px var(--surf), 0 0 0 6px var(--vc); font-weight: 800; font-size: .95rem; line-height: 1.15; text-align: center; margin: 6px 6px 6px 0; flex: none; color: var(--ink); }
.stamp svg { width: 2.4rem !important; height: 2.4rem !important; color: var(--vc); stroke-width: 3; }
.v-ok { --vc: var(--ok); } .v-no { --vc: var(--ko); } .v-meh { --vc: var(--meh); }
.verdict .res { font-size: 1.15rem; font-weight: 600; margin: 0 0 .25rem; }

/* quiz */
.opts { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-top: 1rem; }
.opt { display: flex; align-items: center; gap: .6rem; min-height: 3.4rem; padding: .5rem 1rem; border: 3px solid var(--line); border-radius: 14px; background: var(--surf); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; text-align: left; letter-spacing: inherit; }
.opt:hover { border-color: var(--brand); background: var(--surf2); }
.opt.right { border-color: var(--ok); background: var(--surf2); font-weight: 600; }
.opt.wrong { border-color: var(--ko); }
.opt .mark { margin-left: auto; display: inline-flex; align-items: center; gap: .3rem; font-size: .85rem; font-weight: 600; }
.opt .mark svg { width: 1.3rem; height: 1.3rem; }
.progress { height: 14px; border: 3px solid var(--line); border-radius: 999px; background: var(--surf); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); }
.stars { display: inline-flex; gap: .15rem; }
.stars svg { width: 1.5rem; height: 1.5rem; }
.stars .on { color: var(--accent); fill: var(--accent); stroke: var(--ink); }
.stars .off { color: var(--line); fill: none; }

/* cartes mémoire */
.flash { min-height: 14rem; display: flex; flex-direction: column; justify-content: center; text-align: center; gap: 1rem; padding: 1.6rem; }
.flash .q { font-family: var(--font-display); font-size: 1.45rem; }
.flash .a { font-size: 1.15rem; border-top: 3px dashed var(--line); padding-top: 1rem; }

/* parcours */
.path { list-style: none; padding: 0; margin: 0; display: grid; gap: .9rem; }
.station { display: grid; grid-template-columns: auto 1fr auto; gap: .9rem; align-items: center; background: var(--surf); border: 3px solid var(--line); border-radius: 18px; padding: .9rem 1.1rem; }
.station.next { border-color: var(--brand); box-shadow: 0 0 0 4px var(--accent); }
.station .num { width: 3rem; height: 3rem; border: 3px solid var(--fc, var(--brand)); border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; }
.station .num svg { width: 1.5rem; height: 1.5rem; color: var(--fc, var(--brand)); }
.badges { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .7rem; padding: 0; list-style: none; margin: 0; }
.badgecard { display: flex; gap: .7rem; align-items: center; padding: .7rem .9rem; border: 3px dashed var(--line); border-radius: 14px; background: var(--surf); color: var(--ink2); }
.badgecard.on { border-style: solid; border-color: var(--ok); color: var(--ink); }
.badgecard svg { width: 2rem; height: 2rem; flex: none; }

/* formulaires */
fieldset { border: 3px solid var(--line); border-radius: 14px; padding: .8rem 1rem 1rem; margin: 0 0 1rem; }
legend { font-weight: 600; padding: 0 .4rem; }
.choices { display: flex; flex-wrap: wrap; gap: .5rem; }
.choice { display: inline-flex; align-items: center; gap: .5rem; min-height: 3rem; padding: .3rem .9rem; border: 3px solid var(--line); border-radius: 14px; background: var(--surf); cursor: pointer; }
.choice:has(input:checked) { border-color: var(--brand); background: var(--surf2); box-shadow: inset 0 -5px 0 var(--accent); font-weight: 600; }
.choice input { width: 1.25rem; height: 1.25rem; accent-color: var(--brand); }
input[type="text"] { font: inherit; letter-spacing: inherit; min-height: 3rem; padding: .4rem .8rem; border: 3px solid var(--line); border-radius: 12px; background: var(--surf); color: var(--ink); width: 100%; max-width: 26rem; }
dialog { border: 4px solid var(--brand); border-radius: 20px; background: var(--bg); color: var(--ink); max-width: min(640px, calc(100vw - 24px)); width: 100%; padding: 1.2rem; font-family: var(--font-body); }
dialog::backdrop { background: rgba(10, 14, 30, .6); }
.tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1rem; padding: 0; list-style: none; }
.tab { min-height: 3rem; padding: .3rem 1rem; border: 3px solid var(--line); border-radius: 14px 14px 4px 4px; background: var(--surf); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; letter-spacing: inherit; }
.tab[aria-pressed="true"] { border-color: var(--brand); background: var(--surf2); box-shadow: inset 0 -5px 0 var(--accent); font-weight: 600; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
.steps li { counter-increment: s; display: flex; gap: .8rem; align-items: flex-start; }
.steps li::before { content: counter(s); flex: none; width: 2.2rem; height: 2.2rem; display: grid; place-items: center; border: 3px solid var(--brand); border-radius: 50%; font-weight: 600; font-family: var(--font-display); }
table.cmp { border-collapse: collapse; width: 100%; font-size: .95rem; }

  const ch = [];

function qKey(q) {

function startQuiz(skill, len) {
  const list = [], seen = new Set(), later = [];
  let guard = 0;
  while (list.length < len && guard++ < 900) {
    const q = genQuestion(skill);
    if (!q) break;
    const key = q.type + "|" + q.prompt + "|" + (q.sent ? plain(q.sent) : "") + "|" + q.target;
    if (seen.has(key)) continue;
    seen.add(key);
    q.key = qKey(q);
    if (S.okq && S.okq[q.key]) { later.push(q); continue; }
    list.push(q);
  }
  // Si presque tout est déjà réussi, on complète avec d'anciennes questions (les moins récentes d'abord)
  let repeats = 0;
  while (list.length < len && later.length) { list.push(later.shift()); repeats++; }
  UI.quiz = { skill, list, i: 0, right: 0, sel: null, hint: false, weak: {}, repeats };
}

function neutralMsg(tool, c, res) {
  if (tool === "effacer") return res.verdict === "ok" ? "La phrase reste correcte." : res.verdict === "meh" ? "La phrase reste possible, mais on perd une information importante. Ce test n'est pas très sûr : essaie un autre outil." : "La phrase est incomplète ou n'a plus de sens.";
  if (tool === "deplacer") return res.verdict === "ok" ? "La phrase sonne juste à la nouvelle place." : "La phrase sonne faux.";
  if (tool === "remplacer") return res.verdict === "ok" ? "Ça marche avec « " + res.pron + " ». " + res.why : "Aucun petit mot (le, la, l', les, lui, leur, y) ne remplace ce groupe.";
  if (res.verdict !== "ok") return "Ce test n'aide pas ici. Essaie un autre outil.";
  return c.fn === "V" ? "Ça marche : le mot est entouré par ne et pas." : c.fn === "S" ? "Ça marche : le groupe est entouré par c'est et qui." : "Ça marche : « et cela se passe » s'ajoute sans problème.";

  const o = { v: 1, p: (S.name || "Élève").slice(0, 20), t: Date.now(), x: S.xp, s: {}, l: lessonsDone(), c: knownCards(), sv: S.solved, cr: S.created, h: S.hints, b: Object.keys(S.badges).length, e: S.history.slice(-12) };

function readCode(str) {

  put(root, ...title("Apprendre", "Sept petites leçons. Je lis à mon rythme, je peux écouter, et je dis « J'ai compris » à la fin."), pictoStrip([["eye", "Je lis"], ["speaker", "J'écoute"], ["tag", "J'essaie"], ["check", "J'ai compris"]]), holder);
  draw();
  function draw(focus) {
    const L = LESSONS[UI.lesson], done = !!S.lessons[L.id];
    fill(holder,
      h("ul", { class: "tabs", role: "list" }, LESSONS.map((l, i) =>
        h("li", null, h("button", { type: "button", class: "tab", "aria-pressed": i === UI.lesson ? "true" : "false", on: { click: () => { UI.lesson = i; draw("#ltitle"); } } },
          (i + 1) + ". " + l.title.replace(/ \(.*\)/, ""), S.lessons[l.id] ? h("span", { class: "sr" }, " (lue)") : null)))),
      h("div", { class: "card brand" },
        h("h2", { id: "ltitle", tabindex: "-1" }, L.title),
        h("div", { class: "row", style: "margin-bottom:.6rem" },
          speakBtn(() => holder.querySelector("#lbody").innerText, "Écouter la leçon"),
          done ? h("span", { class: "pill v-ok", style: "border-color:var(--ok)" }, ico("check"), "Leçon lue") : null),
        h("div", { id: "lbody" }, L.body()),
        h("div", { class: "row", style: "margin-top:1rem" },
          h("button", { type: "button", class: "btn primary", "aria-pressed": done ? "true" : "false", on: { click: () => {
            if (!S.lessons[L.id]) { S.lessons[L.id] = 1; gain(5); toast("Leçon terminée. +5 points", "book"); } else { delete S.lessons[L.id]; save(); }
            draw("#ltitle"); } } }, ico("check"), done ? "J'ai compris (cliquer pour annuler)" : "J'ai compris"),
          h("button", { type: "button", class: "btn", on: { click: () => { const s = SENT.find((x) => x.id === L.lab) || SENT[0]; UI.custom = null; UI.lab = freshLab(s, s.id); go("manipulations"); } } }, ico("tag"), "Essayer dans les manipulations"),
          L.skill ? h("button", { type: "button", class: "btn", on: { click: () => { UI.quizSkill = L.skill; UI.tab = "quiz"; UI.quiz = null; go("entrainer"); } } }, ico("quiz"), "M'entraîner") : null),
        h("div", { class: "row", style: "margin-top:.8rem" },
          UI.lesson > 0 ? h("button", { type: "button", class: "btn ghost", on: { click: () => { UI.lesson--; draw("#ltitle"); } } }, "Leçon précédente") : null,
          UI.lesson < LESSONS.length - 1 ? h("button", { type: "button", class: "btn ghost", on: { click: () => { UI.lesson++; draw("#ltitle"); } } }, "Leçon suivante", ico("next")) : null)));
    holder.append(h("details", { class: "card", style: "margin-top:1.2rem" },
      h("summary", { style: "cursor:pointer;font-weight:600;min-height:2.5rem" }, "Mes pictogrammes"),
      P("Chaque action a toujours le même dessin, en plus des mots. Je peux aussi les agrandir ou les cacher dans « Réglages »."),
      h("ul", { class: "pgrid" }, PICTOS.map(([i, l, d]) => h("li", null, h("span", { class: "pt" }, ico(i)), h("span", null, h("b", null, l), h("br"), h("span", { class: "small muted" }, d)))))));
    if (focus) { const f = $(focus, holder); if (f) f.focus(); }
  }
}

/* ======================================================= PARCOURS */
function bilanText() {
  const t = totals();
  const lines = ["Bilan Manip'Phrases" + (S.name ? " de " + S.name : ""), "Niveau " + (level() + 1) + " (" + LEVELS[level()] + "), " + S.xp + " points",
    "Réponses : " + t.k + " bonnes sur " + t.n];
  SK.forEach((s) => { const x = st(s.k); lines.push(s.name + " : " + starsOf(s.k) + " étoile(s) sur 3 (" + x.k + "/" + x.n + ")"); });
  lines.push("Leçons lues : " + lessonsDone() + "/" + LESSONS.length, "Cartes connues : " + knownCards() + "/" + CARDS.length, "Phrases résolues : " + S.solved, "Phrases créées : " + S.created, "Indices demandés : " + S.hints);
  return lines.join("\n");
}
function viewParcours(root) {
  const t = totals(), nxt = nextStep();
  const pct = Math.round(((S.xp % 60) / 60) * 100);
  const bil = h("textarea", { class: "bilan", readonly: true, "aria-label": "Mon bilan, à montrer à la maîtresse", rows: "9", on: { focus: (e) => e.target.select() } }, bilanText());
  const copyMsg = h("span", { role: "status", class: "muted small" });
  put(root, ...title("Mon parcours", "Cinq étapes pour devenir un expert. Je gagne des étoiles en répondant juste, sans pression."),
    h("div", { class: "card brand", style: "margin-bottom:1rem" },
      h("div", { class: "mascot" }, magma(), h("div", null,
        h("p", { class: "xl", style: "margin:0" }, "Niveau " + (level() + 1) + " · " + LEVELS[level()]),
        h("p", { style: "margin:0 0 .4rem" }, S.xp + " points · " + t.k + " bonnes réponses sur " + t.n),
        h("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "60", "aria-valuenow": String(S.xp % 60), "aria-label": "Avancement vers le niveau suivant", style: "min-width:220px" }, h("i", { style: "width:" + pct + "%" }))))),
    h("ol", { class: "path" }, SK.map((s, i) => {
      const x = st(s.k), n = starsOf(s.k), isNext = nxt && nxt.k === s.k;
      const li = LESSONS.find((l) => l.skill === s.k);
      return h("li", { class: "station f-" + s.fn + (isNext ? " next" : "") },
        h("span", { class: "num", "aria-hidden": "true" }, ico("sh_" + s.fn)),
        h("div", null,
          h("h2", { style: "margin:0" }, "Étape " + (i + 1) + " : " + s.name, isNext ? h("span", { class: "pill", style: "margin-left:.5rem" }, "Prochaine étape") : null),
          h("p", { style: "margin:.2rem 0" }, starsNode(n), " ", h("span", { class: "muted small" }, x.n ? x.k + " bonnes réponses sur " + x.n : "Pas encore commencé")),
          li && S.lessons[li.id] ? h("span", { class: "pill" }, ico("book"), "Leçon lue") : null),
        h("div", { class: "act row" },
          h("button", { type: "button", class: "btn primary", on: { click: () => { UI.quizSkill = s.k; UI.tab = "quiz"; UI.quiz = null; go("entrainer"); } } }, ico("play"), "Jouer", h("span", { class: "sr" }, " : " + s.name.toLowerCase())),
          h("button", { type: "button", class: "btn", on: { click: () => { UI.lesson = Math.max(0, LESSONS.findIndex((l) => l.skill === s.k)); go("apprendre"); } } }, ico("book"), "Leçon", h("span", { class: "sr" }, " : " + s.name.toLowerCase()))));
    })),
    h("h2", { style: "margin-top:1.6rem" }, "Mes badges"),
    h("ul", { class: "badges" }, BADGES.map((b) => h("li", { class: "badgecard" + (S.badges[b.id] ? " on" : "") },
      ico(b.ico), h("div", null, h("b", null, b.name), h("br"), h("span", { class: "small" }, b.desc), h("br"), h("span", { class: "small", style: "font-weight:600" }, S.badges[b.id] ? "Gagné" : "À gagner"))))),
    h("h2", { style: "margin-top:1.6rem" }, "Mon carnet de bord"),
    S.history.length ? h("div", { class: "overflow" }, h("table", { class: "cmp" },
      h("thead", null, h("tr", null, ["Date", "Série", "Résultat"].map((x) => h("th", { scope: "col" }, x)))),
      h("tbody", null, [...S.history].reverse().map((e) => h("tr", null, h("td", null, e.d), h("td", null, e.skill), h("td", null, e.k + " sur " + e.n)))))) : h("p", { class: "muted" }, "Mes séries de quiz apparaîtront ici."),
    h("details", { class: "card", style: "margin-top:1.2rem" },
      h("summary", { style: "cursor:pointer;font-weight:600;min-height:2.5rem" }, "Mon bilan à montrer à la maîtresse"),
      bil,
      h("div", { class: "row", style: "margin-top:.6rem" },
        h("button", { type: "button", class: "btn", on: { click: () => { try { navigator.clipboard.writeText(bil.value).then(() => { copyMsg.textContent = "Bilan copié."; }, () => { copyMsg.textContent = "Copie impossible : sélectionne le texte et copie-le."; bil.select(); }); } catch (e) { copyMsg.textContent = "Copie impossible : sélectionne le texte et copie-le."; bil.select(); } } } }, ico("copy"), "Copier mon bilan"), copyMsg)),
    h("details", { class: "card", style: "margin-top:.8rem" },
      h("summary", { style: "cursor:pointer;font-weight:600;min-height:2.5rem" }, "Mon code pour mon enseignant"),
      P("Je copie ce code et je le donne à mon enseignant. Il contient mon prénom et mes résultats, rien d'autre."),
      codeBox()),
    h("p", { class: "muted small", style: "margin-top:1rem" }, "Mes résultats restent dans ce navigateur, sur cet appareil. Rien n'est envoyé sur Internet."),
    h("div", { style: "margin-top:.6rem" }, h("button", { type: "button", class: "btn ghost", on: { click: () => askDialog("Effacer ma progression ?", "Mes étoiles, mes badges, mes points et mon carnet seront effacés. Je ne pourrai pas les retrouver.", "Oui, tout effacer", () => {
      S = JSON.parse(JSON.stringify(DEF)); save(); applySettings(); UI.quiz = null; UI.deck = null; UI.lab = null; UI.at = null; UI.custom = null; render(); announce("Progression effacée."); }) } }, ico("trash"), "Effacer ma progression")));
}

/* ======================================================= RÉGLAGES */
function openSettings() {
  const t = S.settings;
  const set = (k, v) => { t[k] = v; save(); applySettings(); };
  const chk = (label, key, help) => h("label", { class: "choice", style: "display:flex;margin-bottom:.5rem" },
    h("input", { type: "checkbox", checked: !!t[key], on: { change: (e) => set(key, e.target.checked) } }), h("span", null, label, help ? h("span", { class: "muted small" }, " — " + help) : null));
  const d = $("#dlg");
  d.replaceChildren(
    h("h2", null, "Mes réglages"),
    radioGroup("Apparence", "sk", [["auto", "Automatique"], ["light", "Clair"], ["dark", "Sombre"], ["hc", "Contraste fort"]], t.skin, (v) => set("skin", v)),
    h("fieldset", null, h("legend", null, "Mon ambiance"), moodPicker((id) => { t.mood = id; save(); applySettings(); openSettings(); })),
    h("fieldset", null, h("legend", null, "Mon compagnon"), heroPicker((id) => { t.hero = id; t.heroSet = true; save(); openSettings(); refreshBuddies(); })),
    radioGroup("Pictogrammes", "pi", [[0, "Sans"], [1, "Avec"], [2, "Grands"]], t.picto, (v) => set("picto", Number(v))),
    radioGroup("Taille des lettres", "sz", [[1, "Normale"], [1.15, "Grande"], [1.3, "Très grande"]], t.size, (v) => set("size", Number(v))),
    h("fieldset", null, h("legend", null, "Confort"),
      chk("Lecture facilitée", "read", "lettres plus lisibles et plus espacées"),
      chk("Animations", "motion", "petits mouvements quand je réponds"),
      chk("Sons", "sound", "petits sons de réussite"),
      chk("Lire les questions à voix haute", "auto", canSpeak() ? "dans le quiz" : "non disponible sur cet appareil")),
    voiceBox(),
    h("button", { type: "button", class: "btn primary", on: { click: closeDlg } }, "Fermer"));
  openDlg();
}

function voiceBox() {
  const vs = frVoices();
  if (!canSpeak()) return h("fieldset", null, h("legend", null, "Voix"), P("La lecture à voix haute n'est pas disponible sur cet appareil."));
  return h("fieldset", null, h("legend", null, "Voix de lecture"),
    vs.length ? h("div", { class: "row" },
      h("label", { for: "voice", class: "sr" }, "Choisir une voix"),
      h("select", { id: "voice", on: { change: (e) => { S.settings.voice = e.target.value; save(); say("Bonjour, je suis " + hero().name + ". Voici ma voix."); } } },
        h("option", { value: "", selected: !S.settings.voice }, "Voix automatique"),
        vs.map((v) => h("option", { value: v.voiceURI, selected: S.settings.voice === v.voiceURI }, v.name + " (" + v.lang + ")"))))
      : P("Aucune voix française trouvée sur cet appareil. La voix automatique sera utilisée si elle existe."),
    radioGroup("Vitesse", "vr", [[0.7, "Lente"], [0.9, "Normale"], [1.1, "Rapide"]], S.settings.rate, (v) => { S.settings.rate = Number(v); save(); }),
    speakBtn("Bonjour, je suis " + hero().name + ". Voici ma voix.", "Tester la voix", "Tester la voix"));
}
try { if (canSpeak()) speechSynthesis.addEventListener("voiceschanged", () => { const d = $("#dlg"); if (d && d.open && d.querySelector("#voice") === null) openSettings(); }); } catch (e) {}

/* ======================================================= ROUTEUR ET DÉMARRAGE */
const ROUTES = { accueil: viewAccueil, entrainer: viewEntrainer, creer: viewCreer, manipulations: viewManipulations, apprendre: viewApprendre, parcours: viewParcours, enseignant: viewEnseignant };
const NAV = [["accueil", "Accueil", "home"], ["parcours", "Mon parcours", "path"], ["apprendre", "Apprendre", "book"], ["manipulations", "Manipulations", "tag"], ["entrainer", "S'entraîner", "quiz"], ["creer", "Créer", "build"]];
const fsOn = () => document.fullscreenElement || document.webkitFullscreenElement;
const fsOk = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function toggleFS() {
  try {
    if (fsOn()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const r = document.documentElement; (r.requestFullscreen || r.webkitRequestFullscreen).call(r); }
  } catch (e) {}
}
function refreshFS() { const b = $("#fs"); if (b) b.replaceChildren(ico(fsOn() ? "unfull" : "full"), fsOn() ? "Quitter le plein écran" : "Plein écran"); }
document.addEventListener("fullscreenchange", refreshFS); document.addEventListener("webkitfullscreenchange", refreshFS);
function refreshBuddies() {
  const lg = document.querySelector(".logo svg"); if (lg) lg.replaceWith(buddy(44));
  document.querySelectorAll(".mascot > svg").forEach((v) => v.replaceWith(buddy()));
}
function drawHeader() {
  const top = $("#topbar");
  if (!top.firstChild) {
    top.append(
      h("a", { class: "logo", href: "#accueil" }, magma(44), h("span", null, "Manip'Phrases", h("small", null, "Les manipulations syntaxiques en jouant"))),
      h("span", { class: "spacer" }),
      h("span", { id: "pill", class: "pill" }),
      h("button", { type: "button", class: "btn", on: { click: openSettings } }, ico("gear"), "Réglages"),
      fsOk() ? h("button", { type: "button", id: "fs", class: "btn", on: { click: toggleFS } }) : null);
    refreshPill(); refreshFS();
  }
  $("#navlist").replaceChildren(...NAV.map(([r, n, i]) => h("li", null, h("a", { class: "navbtn", href: "#" + r, "aria-current": UI.route === r ? "page" : null }, ico(i), n))));
}
function render() {
  let r = (location.hash || "#accueil").slice(1); if (r === "etiquettes") r = "manipulations";
  UI.route = ROUTES[r] ? r : "accueil";
  stopSay();
  drawHeader();
  const main = $("#main");
  main.replaceChildren();
  ROUTES[UI.route](main);
  document.title = "Manip'Phrases";
  const t = $("#title"); if (t) t.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
applySettings();
$(".skip").addEventListener("click", (e) => { e.preventDefault(); $("#main").focus(); });
render();
</script>
